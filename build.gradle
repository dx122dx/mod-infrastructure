plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

ext {
    loom_version_manifests = 'https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json'
    loom_libraries_base = 'https://bmclapi2.bangbang93.com/libraries/'
    loom_resources_base = 'https://bmclapi2.bangbang93.com/assets/'
}

// CI（GitHub Actions）环境可直连 Mojang，自动跳过 BMCLAPI 镜像，
// 避免镜像 SHA1 漂移导致 CI 构建失败；仅本地无法直连时使用镜像。
def useBmclapi = System.getenv("CI") == null

loom {
    // 使用 BMCLAPI 直接下载版本 JSON，绕过 version manifest（仅本地环境）
    // 注意：SHA1 前缀可能随 BMCLAPI 更新而变化，若构建失败请检查此 URL
    if (useBmclapi) {
        customMinecraftManifest = 'https://bmclapi2.bangbang93.com/v1/packages/a540b5c5ded34de717f3acc10c9d3704b66670d8/1.20.1.json'
    }
}

repositories {
    maven {
        name = 'BMCLAPI Minecraft Libraries'
        url = 'https://bmclapi2.bangbang93.com/libraries/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Gegy'
        url = 'https://maven.gegy.dev/releases/'
    }
    mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config / AutoConfig 是必需依赖：
	// AutoConfig 承载模组自身固定配置项，Cloth ConfigBuilder 构建 Feature 动态开关界面
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ModMenu 为可选依赖：仅编译期需要 API，运行时缺失不影响功能
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// SpruceUI — 统一 GUI 布局框架（ScreenContainer/TableLayout 等）。
	// modApi 使其坐标进入本仓 POM，下游模组（qab 等）编译期可经 infrastructure 传递解析；
	// include JiJ 打进 infrastructure 产物，运行时随 infrastructure 一并加载，下游无需单独安装。
	// SpruceUI 的 POM 非 optional 依赖 fabric-loader 与 fabric-api 模块，必须排除，避免污染产物。
	modApi("dev.lambdaurora:spruceui:${project.spruceui_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	include("dev.lambdaurora:spruceui:${project.spruceui_version}") {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc")
	}

	// Test dependencies — JUnit 提供单元测试能力（ConfigLocker 等纯逻辑测试无需 Minecraft 引导）
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = false
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	withJavadocJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Maven Central 快照发布要求禁用 Gradle Module Metadata，
// 避免 .module 文件泄露 flatDir 解析出的本地依赖坐标（见 chunkscanner 同款约束）。
tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = false
}

// javadoc 关闭 doclint，仅生成告警，避免源码既有注释的格式/链接问题阻塞 build / 发布。
tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	(options as StandardJavadocDocletOptions).addBooleanOption('Xdoclint:none', true)
}

// 填充 maven-publish 配置：坐标与快照仓库全部由外部属性/环境变量驱动，
// 属性缺省时回落到现有 group/version，本地 ./gradlew build 行为完全不变。
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			// 发布坐标覆盖契约：CI 传 -PpublishGroup / -PpublishVersion，缺省回落到现有值
			groupId    = findProperty('publishGroup')   ?: project.group
			artifactId = project.archives_base_name
			version    = findProperty('publishVersion') ?: project.version

			pom {
				name        = 'Billy\'s Mod infrastructure'
				description = 'A general-purpose client-side infrastructure mod for Fabric: module framework, config locking and unified core.config management.'
				url         = 'https://github.com/dx122dx/mod-infrastructure'
				licenses {
					license {
						name = 'GNU Affero General Public License v3.0 only'
						url  = 'https://www.gnu.org/licenses/agpl-3.0.txt'
					}
				}
				developers {
					developer {
						id    = 'billy65536'
						name  = 'billy65536'
					}
				}
				scm {
					connection      = 'scm:git:git://github.com/dx122dx/mod-infrastructure.git'
					developerConnection = 'scm:git:ssh://github.com/dx122dx/mod-infrastructure.git'
					url             = 'https://github.com/dx122dx/mod-infrastructure'
				}
			}
		}
	}

	repositories {
		maven {
			name = 'centralSnapshots'
			url  = 'https://central.sonatype.com/repository/maven-snapshots/'
			credentials {
				username = System.getenv('CENTRAL_TOKEN_USERNAME')
				password = System.getenv('CENTRAL_TOKEN_PASSWORD')
			}
		}
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
